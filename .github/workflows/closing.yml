# Closing prices for NBA player props (DraftKings via ESPN, free): every 15 minutes, any game tipping off within the
# next 50 minutes is captured a few minutes before tip-off and saved to nba.json on the 'closing' branch. The Line Board
# bet tracker reads it for each bet's closing line value, the bookie vig and the fair price. See .github/scripts/closing.py.
name: Closing prop prices

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Capture every game not yet started right now, into test.json (checking the source)
        type: boolean
        default: false

concurrency:
  group: closing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
          sparse-checkout: .github/scripts

      - uses: actions/checkout@v4
        with:
          ref: closing
          path: data

      - name: Capture
        env:
          TEST: ${{ inputs.test && '1' || '' }}
        run: |
          git -C data config user.name valuevault-epl
          git -C data config user.email 320639260+valuevault-epl@users.noreply.github.com
          if [ -n "$TEST" ]; then out=data/test.json; else out=data/nba.json; fi
          python3 main/.github/scripts/closing.py "$out"
